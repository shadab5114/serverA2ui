[project]
name = "a2ui-server"
version = "0.1.0"
description = "GenUI playground backend (Python): AG-UI over SSE, LangGraph, A2UI v0.9 generation grounded in @shadab5114/pds-core."
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "fastapi>=0.141.1",
    "jsonschema>=4.26.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["eval: decision evals against the real model (on demand: uv run pytest -m eval)"]
addopts = "-m 'not eval'"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
