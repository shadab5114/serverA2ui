<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AG-UI Phase 1 — Raw SSE Test Client</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    button { font: inherit; padding: .5rem 1rem; border-radius: 8px; border: 1px solid #8888; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }
    .panel { border: 1px solid #8884; border-radius: 10px; padding: 1rem; overflow: auto; max-height: 420px; }
    .panel h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; opacity: .6; margin: 0 0 .5rem; }
    #reply { white-space: pre-wrap; min-height: 3rem; }
    #log { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
    .ev { padding: 1px 0; }
    .ev-RUN_STARTED, .ev-RUN_FINISHED { color: #2a8; }
    .ev-TEXT_MESSAGE_START, .ev-TEXT_MESSAGE_END { color: #58f; }
    .ev-RUN_ERROR { color: #e44; }
    .status { font-size: .85rem; opacity: .7; margin-left: .75rem; }
  </style>
</head>
<body>
  <h1>AG-UI Phase 1 — Raw SSE Test Client</h1>
  <p>POSTs a <code>RunAgentInput</code> to <code>/agui/run</code>, reads the SSE
     stream, and renders the hand-emitted AG-UI lifecycle.</p>
  <button id="run">Run turn</button>
  <span class="status" id="status">idle</span>

  <div class="cols">
    <div class="panel">
      <h2>Rendered conversation</h2>
      <div id="reply"></div>
    </div>
    <div class="panel">
      <h2>Raw event log</h2>
      <div id="log"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const btn = $("run"), reply = $("reply"), log = $("log"), status = $("status");

    function logEvent(evt) {
      const div = document.createElement("div");
      div.className = "ev ev-" + (evt.type || "?");
      div.textContent = evt.type + "  " + JSON.stringify(
        Object.fromEntries(Object.entries(evt).filter(([k]) => k !== "type"))
      );
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function runTurn() {
      btn.disabled = true;
      reply.textContent = "";
      log.textContent = "";
      status.textContent = "streaming…";

      const body = {
        threadId: "thread_demo",
        runId: "run_" + Date.now(),
        state: {},
        messages: [{ id: "u1", role: "user", content: "hello" }],
      };

      const resp = await fetch("/agui/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      // Parse the SSE stream manually: frames are separated by a blank line,
      // payload lives on `data:` lines.
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let sep;
        while ((sep = buffer.indexOf("\n\n")) !== -1) {
          const frame = buffer.slice(0, sep);
          buffer = buffer.slice(sep + 2);
          const dataLine = frame.split("\n").find((l) => l.startsWith("data:"));
          if (!dataLine) continue;
          const evt = JSON.parse(dataLine.slice(5).trim());
          logEvent(evt);
          if (evt.type === "TEXT_MESSAGE_CONTENT") reply.textContent += evt.delta;
          if (evt.type === "RUN_FINISHED") status.textContent = "done ✓";
          if (evt.type === "RUN_ERROR") status.textContent = "error ✗";
        }
      }
      btn.disabled = false;
      if (status.textContent === "streaming…") status.textContent = "closed";
    }

    btn.addEventListener("click", runTurn);
  </script>
</body>
</html>
